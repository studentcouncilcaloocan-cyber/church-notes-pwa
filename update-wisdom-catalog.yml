name: Update Words of Wisdom catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Extract playlist metadata
        run: python scripts/update-wisdom-catalog.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Words of Wisdom video catalog"
            git push
          fi
